    <p class="small muted" style="margin:8px 0 0">Sortiert nach Eiweiß pro Kalorie. Grundliste: Durchschnittswerte – bei Markenprodukten weichen sie etwas ab.</p></div>`;
}

// ================= Events =================
document.addEventListener('click', e=>{
  unlockAudio();
  if(e.target.id==='sheet'){ closeSheet(); return; }     // Tipp auf den Hintergrund schließt
  const b = e.target.closest('[data-action]'); if(!b) return;
  const A = b.dataset.action, S = ui.sheet;
  const rerenderSheet = () => { renderSheet(); };
  switch(A){
    case 'tab': go(b.dataset.tab, b.dataset.tab==='mehr' ? null : state.sub); break;
    case 'go': go(b.dataset.tab, b.dataset.sub); break;
    case 'back': state.sub = null; window.scrollTo(0,0); break;
    case 'set': state.profile[b.dataset.field]=b.dataset.value; break;
    case 'theme': state.theme=b.dataset.value; break;
    case 'sound': state.sound = b.dataset.value==='1'; if(state.sound){ unlockAudio(); beep(); } break;
    case 'day': { const x=state.schedule[b.dataset.day]; x.on=!x.on; break; }
    case 'regen': state.seed=(state.seed||0)+1; state.swaps={}; toast('Neue Übungsauswahl'); break;
    case 'swap': {
      const plan = getPlan(state); const ex = EX[b.dataset.ex];
      const list = candidates(ex.p, plan.ctx);
      const next = list[(list.findIndex(x=>x.id===ex.id)+1) % list.length];
      state.swaps[b.dataset.key] = next.id; toast('Getauscht: '+next.n);
      const openIdx = [...document.querySelectorAll('details.sess')].map(d=>d.open);
      save(); render();
      document.querySelectorAll('details.sess').forEach((d,i)=>d.open=!!openIdx[i]);
      return;
    }
    case 'guide': openSheet('guide', {ex:b.dataset.ex}); return;
    case 'deloadStart': { const t=todayStr(); state.deloadUntil = addDays(weekStart(t), 6); toast('Entlastungswoche aktiviert'); break; }
    case 'deloadEnd': state.cycleStart = todayStr(); state.deloadUntil = null; break;
    case 'deloadSnooze': state.deloadSnooze = addDays(todayStr(), 7); toast('Erinnerung in einer Woche'); break;
    case 'start': startSession(b.dataset.day); break;
    case 'setdone': {
      const it = state.active.items[+b.dataset.i], st = it.sets[+b.dataset.s];
      if(!st.done && !st.reps){ st.reps = String(it.hi); }
      st.done = !st.done;
      const hadPR = !!st.pr, pr = sessionPRs(state.active).find(p=>p.set===st);
      if(st.done && pr && !hadPR){ toast(`🏆 ${it.name}: ${pr.txt}`, 4000); celebrate(); ui.lastPR = b.dataset.i+':'+b.dataset.s; setTimeout(()=>{ ui.lastPR = null; }, 800); }
      if(st.done){
        const allDone = state.active.items.every(i=>i.sets.every(s=>s.done));
        if(!allDone) startTimer(it.rest||90, it.name); else state.timer = null;
      }
      break;
    }
    case 'addset': { const it=state.active.items[+b.dataset.i]; const l=it.sets[it.sets.length-1]; it.sets.push({kg:l?l.kg:'',reps:'',done:false}); break; }
    case 'discard': if(!confirm('Einheit verwerfen?')) return; state.active=null; state.timer=null; break;
    case 'finish': if(!finishSession()) return; break;
    case 'dellog': if(!confirm('Eintrag löschen?')) return; state.logs=state.logs.filter(l=>l.id!==b.dataset.id); break;
    case 'tminus': if(state.timer){ state.timer.endAt -= 15000; } save(); renderTimer(); return;
    case 'tplus': if(state.timer){ state.timer.endAt += 15000; state.timer.total += 15; } save(); renderTimer(); return;
    case 'tskip': state.timer = null; save(); renderTimer(); return;
    // Essen
    case 'fday': { const d=+b.dataset.d; ui.foodDate = d===0 ? todayStr() : addDays(ui.foodDate, d); if(ui.foodDate>todayStr()) ui.foodDate=todayStr(); render(); return; }
    case 'foodAdd': ui.addMeal = b.dataset.meal; ui.searchState=null; openSheet('add', {mode: state.food.favs.length||state.food.recent.length ? 'mine' : 'search'}); return;
    case 'addMode': if(!S) return; stopScanner(); S.mode = b.dataset.mode; delete S.quick; rerenderSheet(); return;
    case 'setMeal': ui.addMeal = b.dataset.meal; document.querySelectorAll('[data-action=setMeal]').forEach(x=>x.classList.toggle('on', x.dataset.meal===ui.addMeal)); return;
    case 'closeSheet': closeSheet(); return;

    case 'scanTorch': scanToggle('torch'); return;
    case 'scanZoom': scanToggle('zoom'); return;
    case 'eanLookup': { const c=(($('#ean')||{}).value||'').replace(/\D/g,''); if(c.length<8){ toast('Bitte die 8- oder 13-stellige Nummer unter dem Barcode eingeben'); return; } stopScanner().then(()=>lookupBarcode(c)); return; }

    case 'pickLocal': { const f=(ui.searchLocal||[])[+b.dataset.i]; if(f) openSheet('amount', {food:f, g:lmBase(f.units||{})}); return; }
    case 'mtParse': { if(!S) return; S.text = ($('#mealText')||{}).value||''; if(!S.text.trim()){ toast('Bitte erst eintippen, was du gegessen hast'); return; }

      const miss = S.items.filter(x=>!x.food).length; if(miss) toast(miss===1?'1 Teil nicht erkannt – antippen für Vorschläge':miss+' Teile nicht erkannt – antippen für Vorschläge', 2500);

    case 'mtPick': { const x=S&&S.items[+b.dataset.i], j=+b.dataset.j, a=x&&x.alts[j]; if(!a) return;
      if(x.food) x.alts[j] = x.food; else x.alts.splice(j,1);
      x.food = a;
      if(!['g','ml','kg','l','cl'].includes(x.q.unit)) x.g = a.units ? lmGrams({u:a.units}, x.q.qty, x.q.unit, x.q.factor, x.q.few) : (a.serving || x.g || 100);
      S.altOpen = null; mtRefresh(); return; }

      c.order = c.order.filter(x=>x!==k); ui.openDay=b.dataset.day; toast('Übung entfernt'); break; }
    case 'resetDay': if(!confirm('Alle Anpassungen für diesen Tag zurücksetzen?')) return; delete state.custom[b.dataset.day]; ui.openDay=b.dataset.day; break;
    case 'pickEx': ui.pickQ=''; openSheet('pickEx', {day:b.dataset.day}); return;
    case 'addEx': { const day=S.day, c=cust(day), key=day+':x-'+uid(); c.added.push({key, ex:b.dataset.ex, sets:3});
      if(c.order.length) c.order.push(key); ui.openDay=day; closeSheet(); toast(EX[b.dataset.ex].n+' hinzugefügt'); break; }
    case 'cxSave': { const n=$('#cxN').value.trim(); if(!n){ toast('Bitte einen Namen eingeben'); return; }
      const cx={id:'cu_'+uid(), n, p:$('#cxP').value, t:$('#cxT').value}; state.customEx.push(cx); registerCustomEx([cx]);
      const day=S.day, c=cust(day), key=day+':x-'+uid(); c.added.push({key, ex:cx.id, sets:3}); if(c.order.length) c.order.push(key);
      ui.openDay=day; closeSheet(); toast('Eigene Übung angelegt'); break; }
    case 'copyMeal': { const y=foodDay(addDays(ui.foodDate,-1)).filter(e=>e.meal===b.dataset.meal);
      const arr=(state.food.days[ui.foodDate] ||= []); y.forEach(e=>arr.push({...e, id:uid()})); toast(y.length+' Einträge übernommen'); break; }
    case 'dishOpen': openSheet('saveDish', {meal:b.dataset.meal}); return;
    case 'dishSave': { const n=$('#dishN').value.trim(); if(!n){ toast('Bitte einen Namen eingeben'); return; }
      const items=foodDay(ui.foodDate).filter(e=>e.meal===S.meal), sm=sumEntries(items);
      state.food.favs = state.food.favs.filter(f=>f.name!==n);
      state.food.favs.push({id:uid(), name:n, per100:null, g:null, kcal:Math.round(sm.kcal), p:Math.round(sm.p*10)/10, c:Math.round(sm.c*10)/10, f:Math.round(sm.f*10)/10, dish:true});
      closeSheet(); toast('Gericht gespeichert'); break; }
    case 'water': { const w=(state.water ||= {}); w[ui.foodDate] = Math.max(0, (w[ui.foodDate]||0) + (+b.dataset.d)); break; }
    case 'mSave': { const m={date:todayStr()}; let any=false;
      for(const [k] of MEASURES){ const v=num($('#m_'+k).value); if(v>=10 && v<=250){ m[k]=Math.round(v*10)/10; any=true; } }
      if(!any){ toast('Bitte mindestens ein Maß in cm eingeben'); return; }
      const old=state.measures.find(x=>x.date===m.date); state.measures = state.measures.filter(x=>x.date!==m.date); state.measures.push({...(old||{}), ...m});
      toast('Maße gespeichert'); break; }
    case 'mSel': ui.mSel = b.dataset.k; render(); return;
    case 'protAdd': { const f = (ui.protList||[])[+b.dataset.i]; if(!f) return; ui.addMeal = mealByTime();
      if(f.per100){ openSheet('amount', {food:{name:f.name, per100:f.per100}, g:f.g}); return; }
      addEntry({name:f.name, kcal:Math.round(f.kcal), p:f.p, c:f.c, f:f.f}); toast(f.name.slice(0,30)+' hinzugefügt'); break; }
    case 'mDel': state.measures = state.measures.filter(x=>x.date!==b.dataset.d); break;
    case 'copy': navigator.clipboard.writeText(exportData()).then(()=>{ state.lastBackup=todayStr(); save(); toast('Kopiert'); },()=>toast('Kopieren nicht möglich')); return;
    case 'importText': importData($('#importText').value); return;
    case 'reset': { if(!confirm('Wirklich alle Daten löschen?')) return; const th=state.theme; state=defaultState(); state.theme=th; toast('Zurückgesetzt'); break; }
    default: return;
  }
  save(); render();
});

document.addEventListener('input', e=>{
  const t = e.target;
  if(t.dataset.field){ state.profile[t.dataset.field]=t.value.trim(); save(); const f=$('#profilFooter'); if(f) f.innerHTML=profilFooter(); }
  else if(t.dataset.log){ const [i,s,k]=t.dataset.log.split(':'); const it=state.active.items[+i]; it.sets[+s][k]=t.value.trim(); save();
    if(k==='kg'){ const p=$('#plates-'+i), w=$('#warm-'+i); if(p) p.innerHTML=platesHtml(it); if(w) w.innerHTML=warmHtml(it, state.active.items.findIndex(x=>x.main)===+i); } }
  else if(t.dataset.note!==undefined){ const v=t.value; if(v.trim()) state.notes[t.dataset.note]=v; else delete state.notes[t.dataset.note]; save(); }
  else if(t.dataset.sessnote!==undefined){ state.active.note = t.value; save(); }
  else if(t.id==='pickQ'){ ui.pickQ=t.value; const pos=t.selectionStart; renderSheet(); const n=$('#pickQ'); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} } }
  else if(t.id==='amt' && ui.sheet){
    const g = num(t.value)||0, per = ui.sheet.kind==='amount' ? ui.sheet.food.per100 : (foodDay(ui.foodDate).find(x=>x.id===ui.sheet.id)||{}).per100;
    if(per) $('#amtStats').innerHTML = amtStats(scaleFood(per, g));
  }
  else if(t.id==='libQ'){ ui.libQ = t.value; $('#libList').innerHTML = libList(); }
  else if(t.id==='mealText' && ui.sheet){ ui.sheet.text = t.value; }
  else if(t.id==='mtName' && ui.sheet){ ui.sheet.dishName = t.value; }
  else if(t.classList.contains('mg') && ui.sheet && ui.sheet.items){
    const x = ui.sheet.items[+t.dataset.mi]; if(!x || !x.food) return;
    x.g = Math.max(0, num(t.value)||0);
    const k = $('#mk'+t.dataset.mi); if(k) k.innerHTML = mtKcal(scaleFood(x.food.per100, x.g));
    const sm = $('#mtSum'); if(sm) sm.innerHTML = amtStats(mtSum());
  }
});
document.addEventListener('keydown', e=>{ if(e.key==='Enter' && e.target.id==='fq'){ e.preventDefault(); doSearch(); } if(e.key==='Enter' && e.target.id==='ean'){ e.preventDefault(); $('[data-action=eanLookup]').click(); } });
document.addEventListener('change', e=>{
  const t = e.target;
  if(t.dataset.sched){ state.schedule[t.dataset.sched][t.dataset.key] = t.dataset.key==='dur' ? +t.value : t.value; save(); }
  else if(t.id==='importFile' && t.files[0]){ t.files[0].text().then(importData); }
  else if(t.id==='exSel'){ ui.exSel = t.value; render(); }
  else if(t.dataset.eq){ const k=t.dataset.eq, a=state.profile.noEq; state.profile.noEq = t.checked ? a.filter(x=>x!==k) : [...new Set([...a,k])]; state.swaps={}; save(); }
});
document.addEventListener('toggle', e=>{ const d=e.target; if(d.classList && d.classList.contains('sess') && d.open) ui.openDay = d.dataset.day; }, true);
$('#sheet').addEventListener('close', ()=>{ if($('#sheet').open) return; stopScanner(); ui.sheet = null; render(); });
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible'){ const t=todayStr(); if(ui.foodDate>t) ui.foodDate=t; renderTimer();
    if(ui.sheet && ui.sheet.kind==='add' && ui.sheet.mode==='scan' && !ui.scan) startScanner(); }
  else if(ui.scan) stopScanner();   // Kamera aus, wenn die App in den Hintergrund geht
});

if(!profileValid(state.profile) && state.tab==='plan' && !state.logs.length){ state.tab='mehr'; state.sub='profil'; }
render();
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); }catch(e){}
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
