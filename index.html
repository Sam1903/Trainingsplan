<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trainingsplan</title>
<meta name="description" content="Trainingsplan, Kalorientracker und Fortschritt – alle Daten bleiben auf deinem Gerät.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Trainingsplan">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script>
try{var t=(JSON.parse(localStorage.getItem('ganzkoerper-plan-v1')||'{}')||{}).theme;if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}
</script>
<style>
:root{
  --bg:#f4f5f2; --card:#ffffff; --card2:#f0f2ee; --text:#1b1f1d; --muted:#626b66; --line:#dfe3de;
  --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#d9efec; --warn:#a15c07; --warn-soft:#fbefd9;
  --danger:#b42318; --ok:#15803d; --light:#4f6bd8; --light-soft:#e3e8fb;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1211; --card:#191d1b; --card2:#212624; --text:#e8ece9; --muted:#9aa49f; --line:#2c322f;
    --accent:#2bb3a6; --accent-ink:#04201d; --accent-soft:#163a36; --warn:#f0b35a; --warn-soft:#3a2c14;
    --danger:#f2775f; --ok:#4ade80; --light:#8ea2f2; --light-soft:#232b4a;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1211; --card:#191d1b; --card2:#212624; --text:#e8ece9; --muted:#9aa49f; --line:#2c322f;
  --accent:#2bb3a6; --accent-ink:#04201d; --accent-soft:#163a36; --warn:#f0b35a; --warn-soft:#3a2c14;
  --danger:#f2775f; --ok:#4ade80; --light:#8ea2f2; --light-soft:#232b4a;
  --shadow:none; color-scheme:dark;
}
:root[data-theme="light"]{color-scheme:light}
:root{color-scheme:light dark}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top) 0 0;-webkit-tap-highlight-color:transparent}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
header.top h1{margin:0;font-size:22px;letter-spacing:-.01em}
header.top p{margin:2px 0 0;color:var(--muted);font-size:13px}
main{max-width:640px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:18px}
.card h3{margin:14px 0 6px;font-size:15px}
.muted{color:var(--muted)} .small{font-size:13px}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input,select{font:inherit;font-size:16px;color:var(--text);background:var(--card2);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;width:100%;min-height:44px;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto}
button{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--card2);color:var(--text);
  border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer}
button.on,button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.ghost{background:transparent}
button.danger{color:var(--danger)}
button.icon{min-width:44px;padding:8px 10px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}
.day{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.day:first-of-type{border-top:0}
.day .tog{width:100%}
.day .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.day.off .opts{opacity:.35;pointer-events:none}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.heavy{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.light{background:var(--light-soft);color:var(--light);border-color:transparent}
.hint{background:var(--warn-soft);color:var(--text);border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0 0}
.hint b{color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.stat{background:var(--card2);border-radius:10px;padding:10px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
details.sess{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;box-shadow:var(--shadow)}
details.sess>summary{list-style:none;padding:14px 16px;cursor:pointer}
details.sess>summary::-webkit-details-marker{display:none}
details.sess>summary .t{font-weight:700;font-size:17px}
details.sess .body{padding:0 16px 16px}
.ex{display:grid;grid-template-columns:28px 1fr auto;gap:10px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.ex .n{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px}
.ex .name{font-weight:600}
.ex .meta{font-size:14px;margin-top:2px;font-variant-numeric:tabular-nums}
.ex .w{font-size:13px;color:var(--accent);margin-top:2px}
.ex .tip{font-size:13px;color:var(--muted);margin-top:2px}
ul.plain{margin:4px 0 0;padding-left:18px} ul.plain li{margin:2px 0;font-size:14px}
.bar{display:grid;grid-template-columns:110px 1fr 36px;gap:8px;align-items:center;font-size:14px;margin:6px 0}
.bar .track{height:10px;background:var(--card2);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:6px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums}
.setrow{display:grid;grid-template-columns:30px 1fr 1fr 52px;gap:8px;align-items:center;margin:6px 0}
.setrow input{text-align:center;padding:8px}
.setrow .chk{min-width:52px;padding:0;font-size:20px}
.setrow .chk.done{background:var(--ok);border-color:var(--ok);color:#fff}
.setrow .prmark{font-size:18px;text-align:center}
.setrow .prmark.pop{animation:prpop .5s ease-out}
.setrow.pr input{border-color:var(--warn)}
@keyframes prpop{0%{transform:scale(.3)}70%{transform:scale(1.35)}100%{transform:scale(1)}}
.prrow{border-top:1px solid var(--line);padding:8px 0}
.prrow .fn{font-weight:600;font-size:15px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:1000;overflow:hidden}
.confetti i{position:absolute;top:-24px;width:8px;height:14px;border-radius:2px;animation-name:cfall;animation-timing-function:cubic-bezier(.3,.6,.6,1);animation-fill-mode:forwards}
@keyframes cfall{to{top:105vh;transform:translateX(40px) rotate(720deg);opacity:.7}}
@media (prefers-reduced-motion: reduce){.confetti{display:none}.setrow .prmark{animation:none}}
.lgex{padding:12px 0;border-top:1px solid var(--line)}
.lgex:first-of-type{border-top:0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{border:0;border-radius:0;background:transparent;color:var(--muted);font-size:11px;padding:8px 2px 6px;min-height:56px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.act{color:var(--accent);font-weight:600}
.empty{text-align:center;padding:30px 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));background:var(--text);color:var(--bg);
  padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
textarea{width:100%;min-height:120px;font:13px/1.4 ui-monospace,Menlo,monospace;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px}
.disclaimer{font-size:12px;color:var(--muted);text-align:center;margin:18px 6px}
@media (max-width:380px){.grid3{grid-template-columns:1fr 1fr}.bar{grid-template-columns:90px 1fr 30px}}
body.has-timer main{padding-bottom:calc(170px + env(safe-area-inset-bottom))}
button:disabled{opacity:.45}
.back{margin:-4px 0 10px -8px;padding:6px 8px;min-height:36px;color:var(--accent);font-weight:600;border:0}
.linkbtn{background:none;border:0;padding:0;min-height:0;text-align:left;color:inherit;font:inherit;font-weight:600;cursor:pointer}
.linkbtn .info{color:var(--muted);font-weight:400;font-size:13px}
.lgex .linkbtn{font-size:16px}
/* Mehr */
.card.list{padding:4px 16px}
.mitem{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-radius:0;border-top:1px solid var(--line);padding:12px 0;min-height:56px;text-align:left}
.card.list .mitem:first-child,.card .mitem:first-of-type{border-top:0}
.mitem.slim{min-height:44px;padding:8px 0;font-size:15px}
.mi{font-size:22px;width:32px;text-align:center}
/* Essen */
.datenav{margin-bottom:12px}
.datenav .icon{font-size:22px;line-height:1}
.rings{display:flex;justify-content:space-around;gap:10px}
.ring{position:relative;width:130px;text-align:center}
.ring svg{width:130px;height:130px;display:block}
.rtrack{fill:none;stroke:var(--card2);stroke-width:10}
.rfill{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .4s}
.rfill.over{stroke:var(--warn)}
.rtxt{position:absolute;top:0;left:0;width:130px;height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rtxt b{font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}
.rtxt span{font-size:11px;color:var(--muted)}
.rlbl{font-size:13px;font-weight:600;margin-top:2px}
.bar .fill.over{background:var(--warn)}
.bar.macro{grid-template-columns:104px 1fr auto}
.hint.ok b{color:var(--accent)}
.card.meal{padding:12px 16px}
.addbtn{width:36px;min-width:36px;min-height:36px;padding:0;font-size:22px;line-height:1;border-radius:50%}
.fitem{display:flex;width:100%;gap:10px;align-items:center;text-align:left;background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:8px 0;min-height:48px;margin-top:6px}
.fitem .fn{flex:1;font-size:15px;min-width:0}
.fitem .fk{text-align:right;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.fitem2{display:flex;align-items:center;gap:4px;border-top:1px solid var(--line)}
.fpick{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:none;border:0;border-radius:0;padding:8px 0;text-align:left;min-width:0}
.fpick.full{width:100%;border-top:1px solid var(--line)}
.fpick .fn{font-size:15px;font-weight:500}
.tag{display:inline-block;font-size:11px;font-weight:600;color:var(--accent);border:1px solid currentColor;border-radius:6px;padding:0 5px;margin-left:4px;vertical-align:1px}
textarea.mealtext{min-height:76px;font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.mtlist{margin-top:10px}
.mtrow{border-top:1px solid var(--line);padding:2px 0 8px}
.mtrow.miss .fn{color:var(--warn)}
.mtamt{gap:6px}
.mtamt input.mg{width:84px;flex:none;min-height:38px;text-align:right}
.mtalts{margin:4px 0 0 10px;padding-left:10px;border-left:2px solid var(--line)}
.mtalts .ghost{margin-top:6px}
.wchart{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;height:130px;align-items:end}
.wcol{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.wcol span{font-size:11px;color:var(--muted)}
.wbarbox{position:relative;flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.wbar{width:70%;background:var(--accent);border-radius:5px 5px 2px 2px;min-height:2px}
.wbar.over{background:var(--warn)}
.wgoal{position:absolute;left:4%;right:4%;border-top:2px dashed var(--muted);opacity:.7}
/* Bottom-Sheet */
dialog#sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:640px;max-height:88vh;max-height:88dvh;background:var(--card);color:var(--text);
  border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25);overflow:hidden}
dialog#sheet::backdrop{background:rgba(0,0,0,.45)}
#sheetBody{padding:14px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;max-height:88dvh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheethead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sheethead b{flex:1;font-size:17px}
.small-seg button{font-size:13px;min-height:36px;padding:6px 8px}
.seg.tabs2{margin:10px 0 12px}
.seg.tabs2 button{padding-left:6px;padding-right:6px;font-size:14px}
.sheetcontent{min-height:180px}
.reader{position:relative;width:100%;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:#000}
.rvid,.rvid video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rframe{position:absolute;left:8%;right:8%;top:28%;bottom:28%;border:2px solid rgba(255,255,255,.9);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.32);pointer-events:none}
.rline{position:absolute;left:3%;right:3%;height:2px;background:#ff453a;box-shadow:0 0 6px #ff453a;animation:rl 1.4s ease-in-out infinite alternate}
@keyframes rl{from{top:10%}to{top:88%}}
.rctl{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
.rctl .icon{background:rgba(0,0,0,.55);color:#fff;border:0;min-width:44px;font-weight:600}
.rctl .icon.on{background:#fff;color:#000}
ol.plain{margin:4px 0 0;padding-left:20px} ol.plain li{margin:3px 0;font-size:14px}
/* Diagramme */
.chart{width:100%;height:auto;display:block}
.cgrid{stroke:var(--line);stroke-width:1}
.clab{fill:var(--muted);font-size:10px;font-family:inherit}
.cl-raw{fill:none;stroke:var(--muted);stroke-width:1;opacity:.6}
.cl-raw-dot{fill:var(--muted);opacity:.8}
.cl-avg{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.cl-avg-dot{fill:var(--accent)}
.legend{display:flex;gap:14px;margin-top:4px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.lg-raw{background:var(--muted)} .lg-avg{background:var(--accent)}
/* Erweiterungen */
.chkrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.chkrow input{width:22px;min-height:22px;flex:none;-webkit-appearance:checkbox;appearance:auto;accent-color:var(--accent)}
.ex>div:nth-child(2){min-width:0}
.editrow{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:8px}
.editrow .icon{min-width:34px;min-height:36px;padding:4px 6px}
.editrow .setsn{min-width:18px;text-align:center}
.editbtn{min-height:34px;padding:4px 10px;margin-top:10px}
.note{font-size:13px;margin-top:4px;background:var(--card2);border-radius:8px;padding:4px 8px}
.plates{margin-top:4px}
.plates:empty{display:none}
.notebox{margin-top:6px}
.notebox summary{cursor:pointer;color:var(--muted);list-style:none}
.notebox summary::-webkit-details-marker{display:none}
.notebox textarea,textarea[data-sessnote]{min-height:60px;font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin-top:6px}
.mealacts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mealacts button{min-height:34px;padding:4px 10px;font-size:13px}
.glasses{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}
.glass{width:18px;height:24px;border:2px solid var(--accent);border-top-width:1px;border-radius:2px 2px 6px 6px;opacity:.45}
.glass.full{background:var(--accent);opacity:1}
.mtable{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
.mtable th{font-weight:500;color:var(--muted);text-align:left;font-size:12px}
.mtable td,.mtable th{padding:5px 4px;border-top:1px solid var(--line)}
.mtable .neg{color:var(--ok)} .mtable .pos{color:var(--warn)}
/* Pausen-Timer */
#timerbar{position:fixed;left:8px;right:8px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:12;background:var(--card);border:1px solid var(--accent);
  border-radius:14px;padding:8px 10px 8px 14px;box-shadow:0 6px 20px rgba(0,0,0,.18);overflow:hidden;max-width:624px;margin:0 auto}
#timerbar .tprog{position:absolute;left:0;top:0;bottom:0;background:var(--accent-soft);transition:width .25s linear}
#timerbar .tleft{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
#timerbar .icon{min-width:48px;padding:6px 8px;font-size:14px;font-weight:600}
</style>
</head>
<body>
<header class="top">
  <h1 id="title">Trainingsplan</h1>
  <p id="subtitle">Fitnessstudio</p>
</header>
<main id="app"></main>
<div id="timerbar" hidden></div>
<nav class="tabs" id="tabs"></nav>
<dialog id="sheet"><div id="sheetBody"></div></dialog>
<div class="toast" id="toast"></div>

<script src="lebensmittel.js"></script>
<script>
/*LOGIC-START*/
const DAYS = [
  {k:'mo',s:'Mo',l:'Montag'},{k:'di',s:'Di',l:'Dienstag'},{k:'mi',s:'Mi',l:'Mittwoch'},
  {k:'do',s:'Do',l:'Donnerstag'},{k:'fr',s:'Fr',l:'Freitag'},{k:'sa',s:'Sa',l:'Samstag'},{k:'so',s:'So',l:'Sonntag'}
];
const PATTERNS = {
  squat:{n:'Kniebeuge-Muster',m:'Beine (vorne)',upper:false},
  lunge:{n:'Einbeinig',m:'Beine (vorne)',upper:false},
  hinge:{n:'Hüftstreckung',m:'Hintere Kette',upper:false},
  glute:{n:'Gesäß / Beinbeuger',m:'Hintere Kette',upper:false},
  hpush:{n:'Drücken horizontal',m:'Brust',upper:true},
  vpush:{n:'Drücken vertikal',m:'Schultern',upper:true},
  hpull:{n:'Ziehen horizontal',m:'Rücken',upper:true},
  vpull:{n:'Ziehen vertikal',m:'Rücken',upper:true},
  side:{n:'Seitliche Schulter',m:'Schultern',upper:true},
  rear:{n:'Hintere Schulter',m:'Schultern',upper:true},
  biceps:{n:'Bizeps',m:'Arme',upper:true},
  triceps:{n:'Trizeps',m:'Arme',upper:true},
  calf:{n:'Waden',m:'Waden',upper:false},
  core:{n:'Rumpf',m:'Rumpf',upper:false}
};
const MUSCLE_ORDER = ['Beine (vorne)','Hintere Kette','Brust','Rücken','Schultern','Arme','Waden','Rumpf'];

// id, Name, Muster, Level(1-3), Belastung {k:Knie,b:Rücken,s:Schulter} 0-2, Startfaktor (x Körpergewicht, Anfänger), Typ, Extras
function E(id,n,p,lv,load,sw,t,x){return Object.assign({id,n,p,lv,k:load[0],b:load[1],s:load[2],sw,t},x||{});}
const EXERCISES = [

function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const num = v => { const n = parseFloat(String(v??'').replace(',','.')); return isFinite(n)?n:NaN; };

function profileValid(p){
  const h=num(p.height), w=num(p.weight), a=num(p.age);
  return h>=120&&h<=230&&w>=35&&w<=250&&a>=14&&a<=95;
}

function analyze(p, nDays){
  const h=num(p.height), w=num(p.weight), a=num(p.age);
  const bmi = w/((h/100)**2);
  const L = (LEVELS[p.level]||LEVELS.anf).v;
  const goal = GOALS[p.goal] ? p.goal : 'muskel';
  const gentle = a>=50 || bmi>=30;
  const sexAdj = p.sex==='m' ? 5 : p.sex==='w' ? -161 : -78;
  const bmr = 10*w + 6.25*h - 5*a + sexAdj;
  const act = Math.min(1.2 + 0.075*nDays, 1.725);
  const tdee = bmr*act;
  const kcal = tdee + GOALS[goal].kcal;
  const effW = Math.min(w, 27*(h/100)**2); // Bezugsgewicht für Startgewichte (Fettmasse nicht voll mitrechnen)
  const hints = [];
  if(a<18) hints.push(['Jugendliche','Technik vor Gewicht: Starte sehr leicht, lass dir die Übungen von einem Trainer zeigen und steigere langsam.']);
  if(a>=50) hints.push(['50+','Längeres Aufwärmen und gelenkschonende Varianten wurden bevorzugt. Gib Gelenken und Sehnen Zeit und steigere langsam.']);
  if(bmi>=30) hints.push(['Gelenkschonend','Wegen des BMI wurden Maschinen und Kabel bevorzugt, Sprünge weggelassen und Cardio stoßarm gewählt (Rad, Crosstrainer).']);
  if(h>=190) hints.push(['Große Statur','Bei langen Beinen sind Trap-Bar-Kreuzheben, Box Squats und Beinpresse oft angenehmer als tiefe Langhantel-Kniebeugen. Tauschen geht mit ⇄.']);
  if(bmi<18.5) hints.push(['Untergewicht','Achte auf einen Kalorienüberschuss und genug Protein – Muskelaufbau braucht Energie.']);
  const issues = (p.issues||[]).filter(i=>ISSUES[i]), noEq = (p.noEq||[]).filter(k=>EQUIP[k]);
  if(issues.length) hints.push(['Beschwerden berücksichtigt','Übungen mit starker Belastung für '+issues.map(i=>ISSUES[i][1]).join(', ')+' wurden weggelassen, belastende Varianten seltener gewählt. Bei Schmerzen bitte ärztlich oder physiotherapeutisch abklären.']);
  if(nDays===1) hints.push(['1 Trainingstag','Schon 1 Einheit pro Woche bringt viel. Mit 2–3 Tagen sind die Fortschritte aber deutlich größer.']);
  return {h,w,a,bmi,L,goal,gentle,bmr,tdee,kcal,effW,hints,issues,noEq,sex:p.sex||'',prot:GOALS[goal].prot.map(f=>Math.round(f*Math.min(w,effW*1.1)))};
}

function scoreEx(e, ctx, used, rng, heavyMain){
  let s = rng();
  if(e.lv > ctx.L) s -= (ctx.L===1 && e.lv===2) ? .55 : 5;
  if(ctx.L>=2 && e.lv>=2 && heavyMain) s += .5;
  if(ctx.L===3 && e.lv===3 && heavyMain) s += .3;
  if(ctx.gentle){ s -= .45*(e.k+e.b+e.s); if(e.lv===3) s -= .6; }
  if(ctx.bmi>=30 && (e.t==='bw')) s -= 2.5;           // Dips, Klimmzüge, Hängen
  if(ctx.a>=60 && e.lv===3) s -= 3;
  if(ctx.h>=190 && (e.id==='sq_box'||e.id==='hi_trap'||e.id==='sq_legpress')) s += .35;
  if(ctx.a<18 && e.t==='bar' && e.lv>=2) s -= .3;
  for(const i of (ctx.issues||[])) if(ISSUES[i] && e[ISSUES[i][0]]===1) s -= .8;
  if(e.custom) s -= .4;
  if(used && used.has(e.id)) s -= 1.2;
  return s;
}
function candidates(pattern, ctx){
  return allowedList(EXERCISES.filter(e=>e.p===pattern && (e.custom || (!(e.lv>ctx.L+1) && !(ctx.L===1 && e.lv===3)))), ctx)
    .map(e=>({e,s:scoreEx(e,ctx,null,()=>.5,true)})).sort((x,y)=>y.s-x.s).map(x=>x.e);
}
function pick(pattern, ctx, used, rng, heavyMain, main, exclude){
  const base = EXERCISES.filter(e=>e.p===pattern && !e.custom && !(main && e.iso) && !(exclude && exclude.has(e.id)));
  if(!base.length) return null;
  const list = allowedList(base, ctx);
  let best=null,bs=-1e9;
  for(const e of list){ const s=scoreEx(e,ctx,used[pattern],rng,heavyMain); if(s>bs){bs=s;best=e;} }
  (used[pattern] ||= new Set()).add(best.id);
  return best;
}

const SPLITS = {

    d:'Jede Einheit trainiert den ganzen Körper. Ideal bei 1–3 Tagen pro Woche.'},
  ou:{n:'Oberkörper / Unterkörper', seq:['oberA','unterA','oberB','unterB'], min:2,
    d:'Abwechselnd Oberkörper (Brust, Rücken, Schultern, Arme) und Unterkörper (Beine, Gesäß, Waden, Rumpf). Ideal bei 4–5 Tagen.'},
  ppl:{n:'Push / Pull / Beine', seq:['push','pull','beine'], min:3,
    d:'Push: Brust, Schultern, Trizeps · Pull: Rücken, hintere Schulter, Bizeps · Beine: Beine, Gesäß, Waden. Ideal bei 6 Tagen (bei 3 Tagen jede Partie einmal).'},
  vier:{n:'4er-Split', seq:['brust','beine','ruecken','schulter'], min:4,
    d:'Brust & Trizeps · Beine · Rücken & Bizeps · Schultern & Rumpf. Mehr Übungen pro Partie, dafür seltener. Ab 4 Tagen.'}

function recommendSplit(n){ return n<=3 ? 'ganz' : n<=5 ? 'ou' : 'ppl'; }
function resolveSplit(p, n){ return (p.split && SPLITS[p.split]) ? p.split : recommendSplit(n); }

const S = (id,p,main) => ({id,p,main:!!main});
function gkSlots(v){
  const knee = v===2 ? 'lunge' : 'squat';
  const hip  = v%2===0 ? 'hinge' : 'glute';
  const push = v%2===0 ? 'hpush' : 'vpush';
  const pull = v%2===0 ? 'vpull' : 'hpull';
  const other = {hpush:'vpush',vpush:'hpush',hpull:'vpull',vpull:'hpull',hinge:'glute',glute:'hinge'};
  const arms = v%2===0 ? ['triceps','biceps'] : ['biceps','triceps'];
  // Reihenfolge = Priorität beim Auffüllen der verfügbaren Zeit
  return [S('knee',knee,1),S('push',push,1),S('hip',hip,1),S('pull',pull,1),S('core','core'),
    S('push2',other[push]),S('pull2',other[pull]),S('leg2',knee==='squat'?'lunge':'squat'),
    S('shoulder',v%2===0?'rear':'side'),S('arm1',arms[0]),S('hip2',other[hip]),S('calf','calf'),S('arm2',arms[1])];
}

const MAJOR = ['Beine (vorne)','Hintere Kette','Brust','Rücken','Schultern'];
function partsOf(slots){ const s=new Set(slots.map(x=>PATTERNS[x.p].m)); return MUSCLE_ORDER.filter(m=>s.has(m)); }
function assignDays(schedule, split){
  const days = DAYS.map((d,i)=>({...d,i,...(schedule[d.k]||{})})).filter(d=>d.on);
  const seq = SPLITS[split].seq;
  return days.map((d,idx)=>({...d, type: seq[idx % seq.length]}));
}

// Leichter Tag nur, wenn am Vortag trainiert wurde UND sich die großen Muskelgruppen überschneiden
function intensityPlan(on, parts){
  const light = new Array(7).fill(false);
  let start = on.findIndex((x,i)=>!x && on[(i+1)%7]);
  start = start<0 ? 0 : (start+1)%7;
  for(let j=1;j<7;j++){
    const i=(start+j)%7, prev=(i+6)%7;
    if(!on[i] || !on[prev] || light[prev]) continue;
    const overlap = MAJOR.filter(m=>parts[i].includes(m) && parts[prev].includes(m)).length;
    if(overlap>=2) light[i]=true;
  }
  return light;
}

function generatePlan(state){
  const p = state.profile, sch = state.schedule;
  if(!profileValid(p)) return null;
  const n0 = DAYS.filter(d=>sch[d.k]&&sch[d.k].on).length;
  if(!n0) return null;
  const split = resolveSplit(p, n0), SP = SPLITS[split];
  const days = assignDays(sch, split), n = days.length;
  const ctx = analyze(p, n);
  const G = GOALS[ctx.goal], L = ctx.L;
  const rng = mulberry32(hashStr(JSON.stringify([p.height,p.weight,p.age,p.sex,p.level,p.goal,split,days.map(d=>d.k),state.seed||0])));
  const slotsOf = days.map(d=>DAY_TYPES[d.type].slots());
  const partsByDay = new Array(7).fill(null);
  days.forEach((d,idx)=>partsByDay[d.i]=partsOf(slotsOf[idx]));
  const light = intensityPlan(DAYS.map((d,i)=>!!partsByDay[i]), partsByDay);
  const used = {};
  const volume = {}; MUSCLE_ORDER.forEach(m=>volume[m]=0);
  const deload = !!(state.deloadUntil && (state._today||todayStr()) <= state.deloadUntil);

  const sessions = days.map((d,idx)=>{
    const isLight = light[d.i] && !deload;
    const dur = Math.max(20, num(d.dur)||60);
    const slots = slotsOf[idx];
    const dayIds = new Set();
    const short = dur<=30;
    const warm = short ? 5 : ctx.gentle ? 10 : 8, cool = short ? 3 : 5;
    const finisher = (ctx.goal==='abnehmen'||ctx.goal==='fitness') && dur>=60 ? 10 : 0;
    let budget = (dur - warm - cool - finisher)*60;
    const items = [];
    const exTime = it => it.sets*(40+it.rest) + 60;
    slots.forEach((sl,si)=>{
      const par = sl.main ? G.main : G.acc;
      let sets = par.s[L-1];
      if(sl.main && split==='ganz' && n<=2 && L>=2) sets += 1;
      if(sl.main && isLight) sets = Math.max(2, sets-1);
      let r = sl.main ? par.r[L-1].slice() : par.r.slice();
      if(isLight && sl.main) r = [r[0]+2, r[1]+2];
      const rest = sl.p==='core' ? 45 : par.rest;
      const swapKey = d.k+':'+sl.id;
      const sw = state.swaps && state.swaps[swapKey];
      let ex = (sw && EX[sw] && EX[sw].p===sl.p) ? EX[sw] : null;
      const it = {slot:sl.id, idx:si, key:swapKey, main:!!sl.main, pattern:sl.p, sets, reps:r, rest};
      const t = exTime(it);
      if(!sl.main && t > budget) return;
      if(!ex) ex = pick(sl.p, ctx, used, rng, sl.main && !isLight, sl.main, dayIds);
      else (used[sl.p] ||= new Set()).add(ex.id);
      if(!ex) return;
      dayIds.add(ex.id);
      it.ex = ex.id;
      budget -= t;
      items.push(it);
    });
    // Zu wenig Zeit: Sätze reduzieren
    while(budget < 0){
      const it = items.filter(i=>i.sets>2).sort((a,b)=>b.sets-a.sets)[0];
      if(!it) break;
      it.sets--; budget += 40+it.rest;
    }
    // Entlastung: gleiche Übungen, aber deutlich weniger Sätze
    if(deload) for(const it of items) it.sets = Math.max(it.main?2:1, Math.round(it.sets*0.6));
    // Anzeige: Hauptübungen, dann Ergänzungen, Rumpf zum Schluss
    const rank = it => it.main ? 0 : it.pattern==='core' ? 2 : 1;
    items.sort((a,b)=>rank(a)-rank(b) || a.idx-b.idx);
    for(const it of items){ volume[PATTERNS[it.pattern].m] += it.sets; it.rpe = deload ? '6' : isLight ? '6–7' : (L===1 ? '7' : '8'); }
    const est = Math.round(warm + cool + finisher + items.reduce((s,it)=>s+exTime(it),0)/60);
    return {
      day:d.k, dayShort:d.s, dayLong:d.l, time:d.time||'', dur, type:d.type, label:DAY_TYPES[d.type].n, deload,
      parts: partsOf(items.map(i=>({p:i.pattern}))), light:isLight,
      warmup: warmupFor(ctx, isLight||deload, warm), cooldown:['3–5 Min. locker ausradeln oder gehen','Dehnen: Hüftbeuger, Brust, Oberschenkel-Rückseite und Waden je 30 s'],
      finisher: finisher ? finisherFor(ctx,isLight) : null, items, est
    };
  });
  const splitHints = [];
  if(n < SP.min) splitHints.push(['Aufteilung', `Mit ${n} Trainingstag${n>1?'en':''} wird beim Split „${SP.n}“ nicht jede Körperpartie jede Woche trainiert. Empfohlen: ${SPLITS[recommendSplit(n)].n}.`]);
  return {ctx, split, sessions, volume, splitHints, consecutive: sessions.some(s=>s.light)};
}

function warmupFor(ctx, isLight, warm){
  const w = [(ctx.gentle?'7':'5')+' Min. lockeres Cardio (Rad, Crosstrainer oder Rudergerät)',
    'Mobilisation: Hüftkreisen, Armkreisen, Katze-Kuh, „World’s Greatest Stretch“ (je 5–8 Wdh.)'];
  if(ctx.gentle) w.push('Gelenke vorbereiten: Schulterkreisen mit Band, Knie- und Sprunggelenkskreisen (3–4 Min.)');
  w.push('Erste Übung: 2 Aufwärmsätze mit ca. 40 % und 70 % des Arbeitsgewichts');
  return w;
}
function finisherFor(ctx, isLight){
  if(isLight) return '10 Min. gleichmäßiges Cardio in moderatem Tempo (du kannst dich noch unterhalten)';
  return ctx.gentle
    ? '10 Min. Intervalle auf Rad oder Crosstrainer: 30 s zügig / 60 s locker'
    : '10 Min. Intervalle am Rudergerät oder Air Bike: 30 s zügig / 60 s locker';
}

function startWeight(ex, ctx){
  if(ex.sw==null) return null;
  const upper = PATTERNS[ex.p].upper;
  let f = ex.sw * [1,1.4,1.8][ctx.L-1] * GOALS[ctx.goal].gf;
  if(ctx.sex==='w') f *= upper ? .62 : .8; else if(ctx.sex!=='m') f *= upper ? .8 : .9;
  if(ctx.a>=50) f *= .85;
  if(ctx.a>=65) f *= .85;
  if(ctx.a<18) f *= .7;
  let kg = f*ctx.effW;
  if(ex.t==='db'||ex.t==='db1'){ kg = Math.max(2, Math.round(kg/2)*2); }
  else { kg = Math.round(kg/2.5)*2.5; kg = Math.max(ex.t==='bar'?20:5, kg); }
  return kg;
}
function increment(ex){
  if(ex.t==='db'||ex.t==='db1') return 2;
  if(ex.id==='sq_legpress') return 5;
  return 2.5;
}
function repText(it){
  const ex = EX[it.ex];
  if(ex.time) return it.sets+' × '+ex.time;
  return it.sets+' × '+it.reps[0]+'–'+it.reps[1]+(ex.side?' je Seite':'');
}

// ---- Datum ----
const pad2 = n => String(n).padStart(2,'0');
function todayStr(d){ d = d || new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function parseDay(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(s, n){ const d = parseDay(s); d.setDate(d.getDate()+n); return todayStr(d); }
function dayKeyOf(s){ return DAYS[(parseDay(s).getDay()+6)%7].k; }          // Mo=0 … So=6
function weekStart(s){ const d = parseDay(s); d.setDate(d.getDate()-((d.getDay()+6)%7)); return todayStr(d); }
function daysBetween(a, b){ return Math.round((parseDay(b)-parseDay(a))/86400000); }

// ---- Ernährung: Tagesziele ----
function macroTargets(ctx, schedule, dateStr){
  const n = DAYS.filter(d=>schedule[d.k]&&schedule[d.k].on).length;
  const train = !!(schedule[dayKeyOf(dateStr)]||{}).on;
  const bonus = n>0 && n<7 ? (train ? 150 : -Math.round(150*n/(7-n))) : 0;
  const kcal = Math.round((ctx.kcal + bonus)/10)*10;
  const p = Math.round((ctx.prot[0]+ctx.prot[1])/2);
  const f = Math.round(Math.max(0.8*ctx.effW, kcal*0.25/9));
  const c = Math.max(0, Math.round((kcal - p*4 - f*9)/4));
  return {kcal, p, c, f, train};
}
function sumEntries(list){
  return (list||[]).reduce((s,e)=>({kcal:s.kcal+(+e.kcal||0), p:s.p+(+e.p||0), c:s.c+(+e.c||0), f:s.f+(+e.f||0)}), {kcal:0,p:0,c:0,f:0});
}
// Werte pro 100 g auf eine Menge umrechnen
function scaleFood(per100, g){
  const k = (+g||0)/100, r = v => Math.round((+v||0)*k*10)/10;
  return {kcal:Math.round((+per100.kcal||0)*k), p:r(per100.p), c:r(per100.c), f:r(per100.f)};
}
// Open-Food-Facts-Produkt → einheitliches Format
function offToFood(prod){

  const n = prod.nutriments || {};
  let kcal = n['energy-kcal_100g'];

  return {name, code:prod.code||'', per100:{kcal:Math.round(kcal), p:+(n.proteins_100g||0), c:+(n.carbohydrates_100g||0), f:+(n.fat_100g||0)},
          serving: +prod.serving_quantity || null};

// ---- Gericht-Erkennung: Freitext → Lebensmittel aus der lokalen Datenbank (lebensmittel.js) ----
function lmNorm(s){
  return String(s||'').toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[éèê]/g,'e')
    .replace(/[^a-z0-9. ]+/g,' ').replace(/\s+/g,' ').trim();
}
function lmStem(t){
  if(t==='eier') return 'ei';
  return t.length>4 ? t.replace(/(en|er|e|n|s)$/,'') : t;
}
const LM_STOP = new Set(['mit','und','von','vom','ein','eine','einen','einem','einer','eines','der','die','das','dem','den','des','etwas','bisschen','wenig','ca','circa','etwa','auf','in','im','aus','dazu','noch','als','zum','zur','plus','oder','frisch','selbstgemacht','selbstgemachte','selbstgemachter','hausgemacht','gross','grosse','grosser','grosses','grossen','klein','kleine','kleiner','kleines','kleinen','normal','normale','normaler','doppelt','doppelte','doppelter','viel','viele','paar']);
let lmIdx = null;
function lmIndex(){
  if(lmIdx) return lmIdx;
  lmIdx = (window.LM||[]).map(e=>({e, keys:[e.n, ...e.a].map(k=>{ const n=lmNorm(k); return {s:n.split(' ').map(lmStem).join(' '), t:n.split(' ').filter(x=>x && !LM_STOP.has(x)).map(lmStem)}; })}));
  return lmIdx;
}
function lmTokMatch(q, k){ return q===k || (k.length>=4 && q.includes(k)) || (q.length>=4 && k.startsWith(q)); }
// Punktzahl: wie gut passen die Suchwörter (Q) zu einem Namen/Synonym (K)
function lmScore(Q, qs, key){
  if(!Q.length || !key.t.length) return 0;
  if(qs===key.s) return 100;
  const K = key.t;
  const qHit = Q.filter(q=>K.some(k=>lmTokMatch(q,k))).length;
  const kHit = K.filter(k=>Q.some(q=>lmTokMatch(q,k))).length;
  if(qHit===Q.length && kHit===K.length) return 90 - Math.abs(Q.join('').length - K.join('').length)/4;
  if(kHit===K.length) return 60 + K.length*6 - (Q.length-qHit)*8;          // ganzer Name steckt in der Eingabe
  if(qHit===Q.length) return 50 - (K.length-kHit)*6;                        // Eingabe steckt im Namen
  return 25*(qHit+kHit)/(Q.length+K.length);
}
function lmFind(text, n){
  const norm = lmNorm(text), qs = norm.split(' ').map(lmStem).join(' ');
  const Q = norm.split(' ').filter(x=>x && !LM_STOP.has(x) && !/^[0-9.]+$/.test(x)).map(lmStem);
  if(!Q.length) return [];
  const res = [];
  for(const it of lmIndex()){
    let best = 0; for(const k of it.keys){ const sc = lmScore(Q, qs, k); if(sc>best) best = sc; }
    if(best>=12) res.push({e:it.e, score: best + (it.keys[0].s===qs ? 1 : 0)});
  }
  res.sort((a,b)=>b.score-a.score || a.e.n.length-b.e.n.length);
  return res.slice(0, n||5);
}
function lmFood(e){ return {name:e.n, per100:{kcal:e.k, p:e.p, c:e.c, f:e.f}, units:e.u, serving:e.u.portion||null, local:true}; }

const LM_NUM = {ein:1,eine:1,einen:1,einem:1,einer:1,eins:1,zwei:2,drei:3,vier:4,fuenf:5,sechs:6,sieben:7,acht:8,neun:9,zehn:10,elf:11,zwoelf:12,paar:2,halb:0.5,halbe:0.5,halber:0.5,halbes:0.5,halben:0.5,anderthalb:1.5,eineinhalb:1.5,viertel:0.25,dutzend:12};
const LM_UNIT = {g:'g',gr:'g',gramm:'g',kg:'kg',kilo:'kg',ml:'ml',l:'l',liter:'l',cl:'cl',
  el:'el',essloeffel:'el',tl:'tl',teeloeffel:'tl',stueck:'stueck',stk:'stueck',st:'stueck',zehe:'zehe',zehen:'zehe',
  scheibe:'scheibe',scheiben:'scheibe',glas:'glas',glaeser:'glas',tasse:'tasse',tassen:'tasse',becher:'becher',
  portion:'portion',portionen:'portion',port:'portion',teller:'teller',schuessel:'schuessel',schale:'schale',schalen:'schale',
  handvoll:'handvoll',dose:'dose',dosen:'dose',kugel:'kugel',kugeln:'kugel',riegel:'riegel',tafel:'tafel',tafeln:'tafel',
  flasche:'flasche',flaschen:'flasche',packung:'packung',packungen:'packung',pck:'packung',pack:'packung',tuete:'packung',tueten:'packung',
  schuss:'schuss',messloeffel:'messloeffel',scoop:'messloeffel',scoops:'messloeffel',roeschen:'roeschen'};
const LM_UDEF = {el:15, tl:5, glas:200, tasse:150, becher:150, handvoll:30, scheibe:40, dose:400, kugel:50, riegel:40, tafel:100, flasche:500, schuss:20, messloeffel:30, zehe:4, roeschen:20};
const LM_ULBL = {stueck:'Stück', scheibe:'Scheibe', el:'EL', tl:'TL', glas:'Glas', tasse:'Tasse', becher:'Becher', portion:'Portion', teller:'Teller', schuessel:'Schüssel', schale:'Schale',
  handvoll:'Handvoll', dose:'Dose', kugel:'Kugel', riegel:'Riegel', tafel:'Tafel', flasche:'Flasche', packung:'Packung', schuss:'Schuss', messloeffel:'Messlöffel', zehe:'Zehe', roeschen:'Röschen', paar:'Paar'};
// Gramm für Menge + Einheit eines Datenbankeintrags
function lmBase(u){ return u.portion || u.stueck || u.teller || u.schuessel || u.tasse || u.glas || u.becher || u.riegel || u.scheibe || u.dose || u.kugel || 100; }
function lmGrams(e, qty, unit, factor, few){
  const u = (e && e.u) || {}, base = lmBase(u);
  let g;
  if(unit==='g' || unit==='ml') g = qty;
  else if(unit==='kg' || unit==='l') g = qty*1000;
  else if(unit==='cl') g = qty*10;
  else if(unit){
    const alt = {teller:['schuessel','portion'], schuessel:['teller','portion'], schale:['portion','becher'], packung:['portion'], stueck:['portion','scheibe'], portion:['stueck','teller'], zehe:['stueck']}[unit] || [];
    g = qty * (u[unit] || alt.map(a=>u[a]).find(Boolean) || LM_UDEF[unit] || base);
  }
  else if(few) g = u.handvoll || 3*(u.stueck || u.scheibe || base/3);          // "ein paar …"
  else if(qty!=null) g = qty>=20 ? qty : qty*(u.stueck || u.scheibe || base);
  else g = base;
  return Math.max(1, Math.round(g*(factor||1)));
}
// Teiltext → {qty, unit, factor, name}
function lmQty(seg){
  let s = ' '+String(seg).toLowerCase()+' ';
  s = s.replace(/\d+(?:[.,]\d+)?\s*%/g,' ')                         // "3,5 %" ist Fettgehalt, keine Menge
       .replace(/½/g,' 0.5 ').replace(/¼/g,' 0.25 ').replace(/¾/g,' 0.75 ')
       .replace(/(\d+)\s*\/\s*(\d+)/g,(m,a,b)=>' '+(+a/+b)+' ')
       .replace(/(\d),(\d)/g,'$1.$2')
       .replace(/(\d)([a-zäöüß])/g,'$1 $2').replace(/([a-zäöüß])(\d)/g,'$1 $2');
  const toks = lmNorm(s).split(' ').filter(Boolean);
  let qty = null, unit = null, factor = 1, few = false, late = null; const name = [];
  for(let i=0;i<toks.length;i++){
    const t = toks[i];
    if(t==='paar'){ few = true; qty = null; continue; }                    // "ein paar Nüsse"
    if(/^\d+(\.\d+)?$/.test(t) || (t in LM_NUM && (qty==null || t==='halb' || t==='halbe'))){
      const v = /^\d/.test(t) ? +t : LM_NUM[t];
      qty = qty!=null && /^halb/.test(t) ? qty*0.5 : (qty!=null && v<1 ? qty+v : v);   // "eine halbe", "1 1/2"
      continue;
    }
    if(LM_UNIT[t] && unit==null){
      if(qty!=null || !name.length){ unit = LM_UNIT[t]; if(qty==null) qty = 1; few = false; continue; }
      late = LM_UNIT[t];                                                  // "Spaghetti großer Teller" – evtl. Teil des Namens
    }
    if(/^(gross|grosse|grosser|grosses|grossen|riesig|riesige|xl)$/.test(t)){ factor *= 1.4; continue; }
    if(/^(klein|kleine|kleiner|kleines|kleinen|mini)$/.test(t)){ factor *= 0.7; continue; }
    if(/^(doppelt|doppelte|doppelter|doppeltes)$/.test(t)){ factor *= 2; continue; }
    name.push(t);
  }
  return {qty, unit, factor, few, late, name: name.join(' ').trim()};
}
// Ein Teilstück erkennen
function lmItem(raw){
  const q = lmQty(raw);
  let hits = lmFind(q.name, 6);
  if(q.late){   // Einheit stand hinter dem Namen: mit und ohne das Wort probieren
    const nm = q.name.split(' ').filter(t=>LM_UNIT[t]!==q.late).join(' '), h2 = lmFind(nm, 6);
    if(h2[0] && (!hits[0] || h2[0].score > hits[0].score + 5)){ hits = h2; q.name = nm; q.unit = q.late; if(q.qty==null) q.qty = 1; }
  }
  const top = hits[0];
  const ok = top && top.score >= 45;
  const e = ok ? top.e : null;
  return {id:uid(), raw:String(raw).trim(), q, food: e ? lmFood(e) : null, g: lmGrams(e, q.qty, q.unit, q.factor, q.few),
          alts: hits.filter(h=>ok ? (h!==top && h.score>=45) : true).slice(0,5).map(h=>lmFood(h.e)), score: top ? top.score : 0};
}
// Ganze Mahlzeit: "2 Eier, 1 Scheibe Vollkornbrot mit Butter, Kaffee mit Milch"
function parseMeal(text){
  const out = [];
  const segs = String(text||'').replace(/(\d),(\d)/g,'$1.$2').split(/[\n,;+&]|\s+und\s+|\s+sowie\s+|\s+dazu\s+/i).map(s=>s.trim()).filter(Boolean);
  for(const seg of segs){
    const whole = lmItem(seg);
    const parts = seg.split(/\s+mit\s+/i);
    if(parts.length>1 && whole.score < 95){
      const sub = parts.map(lmItem);
      // Aufteilen, wenn alle Teile erkannt werden (oder das Ganze gar nicht)
      if(sub.every(x=>x.food) || (!whole.food && sub.some(x=>x.food))){
        // Zutaten ohne Mengenangabe nach "mit": Standardportion, bei Milch & Co. nur ein Schuss
        sub.forEach((x,i)=>{ if(i>0 && x.q.qty==null && !x.q.few && x.food){ const u=x.food.units||{}; x.g = Math.round((u.schuss || lmBase(u)) * x.q.factor); } });
        out.push(...sub); continue;
      }
    }
    out.push(whole);
  }
  return out;
}

// ---- Fortschritt ----
function e1rm(kg, reps){ kg=+kg; reps=+reps; if(!(kg>0)||!(reps>0)) return 0; return reps===1 ? kg : kg*(1+reps/30); }
// ---- Rekorde ----
function doneSets(it){ return (it.sets||[]).filter(s=>s.done && num(s.reps)>0); }
function prAdd(b, kg, r, d){
  if(kg>0){
    if(kg>b.top){ b.top = kg; b.topD = d; }
    const e = e1rm(kg, r); if(e>b.e1){ b.e1 = e; b.e1D = d; b.e1S = [kg, r]; }
    const k = String(kg); if(r>(b.repsAt[k]||0)) b.repsAt[k] = r;
  } else if(r>b.bw){ b.bw = r; b.bwD = d; }
}
// Bestwerte einer Übung aus abgeschlossenen Einheiten
function exBests(logs, exId){
  const b = {n:0, top:0, topD:null, e1:0, e1D:null, e1S:null, repsAt:{}, bw:0, bwD:null};
  for(const l of logs){ const d = String(l.date||'').slice(0,10);
    for(const it of l.items){ if(it.ex!==exId) continue; const ss = doneSets(it); if(!ss.length) continue;
      b.n++; for(const s of ss) prAdd(b, num(s.kg)||0, num(s.reps), d); } }
  return b;
}
// Ist dieser Satz ein Rekord gegenüber den Bestwerten b?
function setPR(b, kg, reps){
  kg = num(kg)||0; reps = num(reps);
  if(!(reps>0) || !b.n) return null;                       // erste Einheit einer Übung: noch kein Rekord
  if(kg>0){
    if(!b.top) return null;
    if(kg>b.top) return {type:'kg', txt:`Neues Höchstgewicht: ${fmt(kg)} kg`};
    const e = e1rm(kg, reps);
    if(e>b.e1+0.05) return {type:'e1rm', txt:`${fmt(kg)} kg × ${reps} – neue Bestleistung (≈ ${fmt(e)} kg max.)`};
    const prev = Math.max(0, ...Object.entries(b.repsAt).filter(([k])=>+k>=kg).map(([,r])=>r));
    if(prev>0 && reps>prev) return {type:'reps', txt:`${reps} Wdh. mit ${fmt(kg)} kg – so viele wie nie`};
    return null;
  }
  if(b.bw && reps>b.bw) return {type:'bw', txt:`${reps} Wdh. am Stück – neuer Rekord`};
  return null;
}
// Alle Rekorde einer laufenden Einheit neu bestimmen (markiert Sätze mit s.pr)
function sessionPRs(a){
  const out = [], cache = {}, d = String(a.date||'').slice(0,10);
  for(const it of a.items){
    const b = cache[it.ex] || (cache[it.ex] = exBests(state.logs.filter(l=>l.id!==a.id), it.ex));
    for(const s of it.sets){
      delete s.pr;
      if(!s.done || !(num(s.reps)>0)) continue;
      const pr = setPR(b, s.kg, s.reps);
      if(pr){ s.pr = pr.type; out.push({ex:it.ex, name:it.name, txt:pr.txt, set:s}); }
      prAdd(b, num(s.kg)||0, num(s.reps), d);
    }
  }
  return out;
}
function exerciseHistory(logs, exId){
  const out = [];
  for(const l of logs){
    const it = l.items.find(i=>i.ex===exId); if(!it) continue;
    const sets = it.sets.filter(s=>s.done && num(s.kg)>0 && num(s.reps)>0);
    if(!sets.length) continue;
    const best = Math.max(...sets.map(s=>e1rm(num(s.kg), num(s.reps))));
    const top = Math.max(...sets.map(s=>num(s.kg)));
    out.push({date:l.date.slice(0,10), e1rm:Math.round(best*10)/10, top});
  }
  return out;
}
// Gleitender 7-Tage-Durchschnitt und Trend (kg pro Woche, lineare Regression über die letzten 28 Tage)
function weightStats(weights, today){
  const w = (weights||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
  const avg = w.map(x=>{ const win = w.filter(y=>daysBetween(y.date,x.date)>=0 && daysBetween(y.date,x.date)<7); return {date:x.date, kg:Math.round(win.reduce((s,y)=>s+y.kg,0)/win.length*10)/10}; });
  const recent = w.filter(x=>daysBetween(x.date, today||todayStr())<=28);
  let perWeek = null;
  if(recent.length>=3 && daysBetween(recent[0].date, recent[recent.length-1].date)>=7){
    const xs = recent.map(x=>daysBetween(recent[0].date,x.date)), ys = recent.map(x=>x.kg);
    const mx = xs.reduce((a,b)=>a+b,0)/xs.length, my = ys.reduce((a,b)=>a+b,0)/ys.length;
    const sl = xs.reduce((s,x,i)=>s+(x-mx)*(ys[i]-my),0) / xs.reduce((s,x)=>s+(x-mx)**2,0);
    perWeek = Math.round(sl*7*100)/100;
  }
  return {sorted:w, avg, perWeek, last:w.length?w[w.length-1]:null};
}
function trendRating(goal, perWeek){
  if(perWeek==null) return null;
  const R = {abnehmen:[-0.75,-0.25,'Ziel: ca. 0,25–0,75 kg pro Woche abnehmen'], muskel:[0.05,0.3,'Ziel: ca. 0,1–0,25 kg pro Woche zunehmen'],
             kraft:[0,0.3,'Ziel: Gewicht halten oder leicht zunehmen'], fitness:[-0.2,0.2,'Ziel: Gewicht ungefähr halten']}[goal];
  const [lo,hi,txt] = R;
  const st = perWeek<lo ? 'low' : perWeek>hi ? 'high' : 'ok';
  const adv = st==='ok' ? 'Passt – weiter so.' :
    goal==='abnehmen' ? (st==='low' ? 'Etwas zu schnell – iss ca. 150–250 kcal mehr, um Muskeln zu schützen.' : 'Zu langsam – reduziere um ca. 150–250 kcal oder bewege dich mehr.') :
    st==='low' ? 'Etwas mehr essen (ca. +150–250 kcal).' : 'Etwas weniger essen (ca. −150–250 kcal).';
  return {st, txt, adv};
}

// ---- Entlastungswoche ----
function deloadInfo(state, today){
  today = today || todayStr();
  const L = (LEVELS[state.profile.level]||LEVELS.anf).v;
  const active = !!(state.deloadUntil && today <= state.deloadUntil);
  const every = L===1 ? 8 : 6;
  const weeks = state.cycleStart ? Math.floor(daysBetween(state.cycleStart, today)/7) : 0;
  const snoozed = state.deloadSnooze && today < state.deloadSnooze;
  return {active, weeks, every, due: !active && !snoozed && weeks >= every-1};
}

// ---- Kalender (.ics) ----
function icsEscape(s){ return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); }
function icsFold(line){ const out=[]; let s=line; while(s.length>73){ out.push(s.slice(0,73)); s=' '+s.slice(73); } out.push(s); return out.join('\r\n'); }
function buildICS(plan, today, uidSeed){
  today = today || todayStr();
  const BY = {mo:'MO',di:'TU',mi:'WE',do:'TH',fr:'FR',sa:'SA',so:'SU'};
  const stamp = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Trainingsplan//DE','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  for(const s of plan.sessions){
    let d = today; while(dayKeyOf(d)!==s.day) d = addDays(d,1);
    const [hh,mm] = (s.time||'18:00').split(':').map(Number);
    const start = parseDay(d); start.setHours(hh||0, mm||0, 0, 0);
    const end = new Date(start.getTime() + s.dur*60000);
    const f = x => x.getFullYear()+pad2(x.getMonth()+1)+pad2(x.getDate())+'T'+pad2(x.getHours())+pad2(x.getMinutes())+'00';
    const desc = s.items.map((it,i)=>`${i+1}. ${EX[it.ex].n} – ${repText(it)}`).join('\n');
    L.push('BEGIN:VEVENT', 'UID:tp-'+s.day+'-'+(uidSeed||'x')+'@trainingsplan', 'DTSTAMP:'+stamp,
      'DTSTART:'+f(start), 'DTEND:'+f(end), 'RRULE:FREQ=WEEKLY;BYDAY='+BY[s.day],
      icsFold('SUMMARY:'+icsEscape('Training: '+s.label)), icsFold('DESCRIPTION:'+icsEscape(desc)),
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEscape('Training: '+s.label),'TRIGGER:-PT30M','END:VALARM','END:VEVENT');
  }
  L.push('END:VCALENDAR');
  return L.join('\r\n');
}

  assist:'Klimmzug-Assistenzmaschine', hipm:'Hip-Thrust-/Glute-Maschine', dipm:'Dip-Maschine', bars:'Dip-Barren / Klimmzugstange',
  abwheel:'Ab-Wheel', latm:'Seitheben-Maschine', flym:'Butterfly-/Reverse-Fly-Maschine', hyper:'Hyperextension-Bank'};
const EQ_OF = {}; for(const [k,ids] of Object.entries(EQUIP)) ids.forEach(id=>EQ_OF[id]=k);
const ISSUES = {knie:['k','Knie'], schulter:['s','Schulter'], ruecken:['b','Unterer Rücken']};
const eqOk = (e, ctx) => !(ctx.noEq||[]).includes(EQ_OF[e.id]);
const jointOk = (e, ctx) => !(ctx.issues||[]).some(i=>ISSUES[i] && e[ISSUES[i][0]]>=2);
// Erlaubte Übungen; falls dadurch nichts übrig bleibt, schrittweise lockern
function allowedList(list, ctx){
  let l = list.filter(e=>eqOk(e,ctx) && jointOk(e,ctx));
  if(!l.length) l = list.filter(e=>eqOk(e,ctx));
  return l.length ? l : list;
}

function registerCustomEx(list){
  for(const c of (list||[])){
    if(!c || !c.id || EX[c.id] || !PATTERNS[c.p]) continue;
    const e = E(c.id, c.n, c.p, 1, [0,0,0], null, c.t||'machine', {custom:true, tip:'Eigene Übung', how:[], err:[]});
    EXERCISES.push(e); EX[c.id] = e;
  }
}

const PLATES = [25,20,15,10,5,2.5,1.25];
function barFor(ex, barKg){
  if(!ex || ex.t!=='bar' || ex.id==='sq_box' || ex.id==='vp_landmine') return null;
  return ex.id==='hi_trap' ? 25 : (+barKg||20);
}
function platesFor(total, bar, plates){
  plates = plates || PLATES;
  total = +total; bar = +bar;
  if(!(total>0)) return null;
  if(total < bar - 0.001) return {below:true, side:[], rest:0};
  let left = Math.round((total-bar)/2*100)/100; const side = [];
  for(const p of plates){ while(left >= p - 0.001){ side.push(p); left = Math.round((left-p)*100)/100; } }
  return {below:false, side, rest:Math.round(left*2*100)/100};
}
function warmupSets(kg, ex, first, bar){
  kg = +kg; if(!(kg>0) || !ex || ex.t==='bw' || ex.t==='time' || ex.t==='assist') return [];
  const db = ex.t==='db' || ex.t==='db1';
  const r = v => db ? Math.max(2, Math.round(v/2)*2) : Math.round(v/2.5)*2.5;
  let out;
  if(bar){
    out = first ? [[bar,10],[r(kg*.4),8],[r(kg*.6),5],[r(kg*.8),3]] : [[r(kg*.6),5]];
    out = out.filter(([w],i)=> (i===0 && first) ? w < kg : (w > bar && w < kg));
  } else {
    out = (first ? [[r(kg*.5),10],[r(kg*.75),5]] : [[r(kg*.6),5]]).filter(([w])=>w>0 && w<kg);
  }
  const seen = new Set(); return out.filter(([w])=>!seen.has(w) && seen.add(w)).map(([w,reps])=>({kg:w, reps}));
}

// ---- Eigene Anpassungen am Plan ----
function applyCustom(plan, state){
  if(!plan) return plan;
  const C = state.custom || {}, G = GOALS[plan.ctx.goal], L = plan.ctx.L;
  const exT = it => it.sets*(40+it.rest) + 60;
  for(const s of plan.sessions){
    const c = C[s.day]; if(!c) continue;
    const before = s.items.reduce((a,it)=>a+exT(it),0);
    let items = s.items.filter(it=>!(c.removed||[]).includes(it.key));
    for(const a of (c.added||[])){
      const sw = state.swaps && state.swaps[a.key];
      const ex = EX[sw && EX[sw] ? sw : a.ex]; if(!ex) continue;
      items.push({slot:'x', key:a.key, main:false, added:true, pattern:ex.p, sets:a.sets || G.acc.s[L-1] || 3,
        reps:G.acc.r.slice(), rest: ex.p==='core' ? 45 : G.acc.rest, rpe: s.deload ? '6' : s.light ? '6–7' : (L===1 ? '7' : '8'), ex:ex.id});
    }
    for(const it of items){ const n = (c.sets||{})[it.key]; if(n) it.sets = n; }
    if(c.order && c.order.length){
      const idx = k => { const i = c.order.indexOf(k); return i<0 ? 1e3 : i; };
      items = items.map((it,i)=>({it,i})).sort((a,b)=>(idx(a.it.key)-idx(b.it.key)) || (a.i-b.i)).map(x=>x.it);
    }
    s.items = items;
    s.est = Math.max(0, Math.round(s.est + (items.reduce((a,it)=>a+exT(it),0) - before)/60));
    s.parts = partsOf(items.map(i=>({p:i.pattern})));
    s.custom = true;
  }
  MUSCLE_ORDER.forEach(m=>plan.volume[m]=0);
  for(const s of plan.sessions) for(const it of s.items) plan.volume[PATTERNS[it.pattern].m] += it.sets;
  return plan;
}
function getPlan(state){ return applyCustom(generatePlan(state), state); }

const PROTEIN_FOODS = [
  PF('Skyr natur',63,11,4,0.2,250), PF('Magerquark',67,12,4,0.3,250), PF('Körniger Frischkäse',98,12.5,2.5,4.3,200),

  PF('Puten-/Hähnchenaufschnitt',100,20,1,1.5,80), PF('Thunfisch im eigenen Saft',116,26,0,1,130), PF('Lachs',208,20,0,13,125),
  PF('Kabeljau',82,18,0,0.7,150), PF('Garnelen',99,24,0.2,0.3,150), PF('Eier (ca. 2 Stück)',155,13,1.1,11,120),
  PF('Eiklar',52,11,0.7,0.2,150), PF('Harzer Käse',112,27,0,0.5,100), PF('Linsen (gekocht)',116,9,20,0.4,200),
  PF('Kichererbsen (gekocht)',164,8.9,27.4,2.6,200), PF('Kidneybohnen (gekocht)',127,8.7,22.8,0.5,200), PF('Tofu natur',120,13,2,7,200),
  PF('Tempeh',192,19,9,11,100), PF('Seitan',135,25,4,2,100), PF('Edamame',121,12,9,5,150),
  PF('Whey-Proteinpulver',380,75,7,6,30), PF('Proteinriegel',360,33,30,12,60), PF('Erdnussmus',600,25,12,50,30)
];
function proteinSuggestions(missingP, kcalLeft, own, n){
  n = n || 6; missingP = +missingP; if(!(missingP > 0)) return [];
  const limit = Math.max(200, (+kcalLeft||0) + 150);
  const build = (src, isOwn) => {
    let v, g = null;
    if(src.per100 && src.per100.p > 0){
      const base = +src.g || 100, step = base <= 40 ? 5 : 10;
      let amt = Math.min(Math.max(missingP / src.per100.p * 100, base*0.5), base*1.5);
      if(src.per100.kcal > 0) amt = Math.min(amt, limit / src.per100.kcal * 100);   // nicht übers Kalorienbudget
      amt = Math.max(step, Math.floor(amt/step)*step);
      g = amt; v = scaleFood(src.per100, amt);
    } else if(+src.p > 0){ v = {kcal:+src.kcal||0, p:+src.p, c:+src.c||0, f:+src.f||0}; }
    else return null;
    if(v.p < 8 || v.kcal > limit) return null;
    const density = v.kcal > 0 ? v.p / v.kcal * 100 : v.p;           // g Protein pro 100 kcal
    const cover = v.p / missingP;
    const score = density * (isOwn ? 1.25 : 1) + (cover >= 0.5 && cover <= 1.1 ? 3 : 0);
    return {name:src.name, g, ...v, per100:src.per100 || null, own:isOwn, cat:src.cat||'own', score};
  };
  const seen = new Set(), pickTop = (arr, k, diverse) => {
    const sorted = arr.filter(Boolean).sort((a,b)=>b.score-a.score)
      .filter(x=>{ const key = x.name.toLowerCase(); if(seen.has(key)) return false; seen.add(key); return true; });
    if(!diverse) return sorted.slice(0, k);
    // Abwechslung: zuerst das Beste je Gruppe (Milchprodukte, Fleisch, Fisch, Pflanzlich …), dann auffüllen
    const out = [], cats = new Set();
    for(const x of sorted) if(out.length < k && !cats.has(x.cat)){ out.push(x); cats.add(x.cat); }
    for(const x of sorted) if(out.length < k && !out.includes(x)) out.push(x);
    return out.sort((a,b)=>b.score-a.score);
  };
  const mine = pickTop((own||[]).map(o=>build(o, true)), 3);
  const base = pickTop(PROTEIN_FOODS.map(o=>build(o, false)), n - mine.length, true);
  return [...mine, ...base];
}

// ================= Training (Log + Timer) =================
function startSession(dayKey){
  const plan = getPlan(state); if(!plan) return;
  const s = plan.sessions.find(x=>x.day===dayKey); if(!s) return;
  if(state.active && !confirm('Es läuft bereits eine Einheit. Verwerfen und neu starten?')) { go('log'); return; }
  state.active = {
    id: uid(), date: new Date().toISOString(), day:s.day, label:`${s.dayLong} · ${s.label}`,
    items: s.items.map(it=>{const wh=weightHint(it,plan.ctx);
      let kg = wh&&wh.kg!=null ? wh.kg : '';
      if(s.deload && kg) kg = Math.round(kg*0.9/2.5)*2.5;
      return {ex:it.ex, name:EX[it.ex].n, target:repText(it), hi:it.reps[1], rest:it.rest, main:!!it.main,
      sets:Array.from({length:it.sets},()=>({kg: kg!==''?String(kg):'', reps:'', done:false}))};})
  };
  go('log');
}
function viewLog(){
  const a = state.active;
  let html = '';
  if(a){
    const doneN = a.items.reduce((s,i)=>s+i.sets.filter(x=>x.done).length,0), total = a.items.reduce((s,i)=>s+i.sets.length,0);
    html += `<div class="card"><div class="row"><h2 style="margin:0">${esc(a.label)}</h2><span class="spacer"></span><span class="pill">${doneN}/${total} Sätze</span></div>
      <p class="small muted" style="margin:6px 0 0">Nach jedem abgehakten Satz startet automatisch der Pausen-Timer.</p>
      ${a.items.map((it,ii)=>`<div class="lgex"><button class="linkbtn name" data-action="guide" data-ex="${it.ex}">${esc(it.name)} <span class="info">ⓘ</span></button>
        <div class="small muted">Ziel: ${esc(it.target)} · Pause ${it.rest||90} s</div>
        <div class="setrow small muted"><span>#</span><span style="text-align:center">kg</span><span style="text-align:center">Wdh.</span><span></span></div>
        ${it.sets.map((st,si)=>`<div class="setrow${st.pr?' pr':''}">${st.pr?`<span class="prmark${ui.lastPR===ii+':'+si?' pop':''}" title="Rekord" aria-label="Rekord">🏆</span>`:`<span class="muted">${si+1}</span>`}
          <input inputmode="decimal" data-log="${ii}:${si}:kg" value="${esc(st.kg)}" placeholder="kg">
          <input inputmode="numeric" data-log="${ii}:${si}:reps" value="${esc(st.reps)}" placeholder="${it.hi}">
          <button class="chk ${st.done?'done':''}" data-action="setdone" data-i="${ii}" data-s="${si}" aria-label="Satz erledigt">✓</button></div>`).join('')}
        <div class="small plates" id="plates-${ii}">${platesHtml(it)}</div>
        <div class="small plates" id="warm-${ii}">${warmHtml(it, a.items.findIndex(x=>x.main)===ii)}</div>
        <div class="row"><button class="ghost small" data-action="addset" data-i="${ii}" style="min-height:36px;padding:6px 10px">+ Satz</button><span class="spacer"></span></div>
        ${noteBox(it.ex)}
      </div>`).join('')}
      <label class="f" style="margin-top:12px"><span>Notiz zur Einheit (optional)</span><textarea data-sessnote rows="2" placeholder="Wie lief es? Energie, Schlaf, Besonderheiten …">${esc(a.note||'')}</textarea></label>
      <div class="row" style="margin-top:12px"><button class="danger" data-action="discard">Verwerfen</button><span class="spacer"></span><button class="primary" data-action="finish">Einheit abschließen</button></div>
    </div>`;
  } else {
    html += `<div class="card empty"><h2>Keine aktive Einheit</h2><p class="muted">Starte eine Einheit im Plan mit „Einheit starten“.</p>
      <button class="primary" data-action="go" data-tab="plan">Zum Plan</button></div>`;
  }
  const logs = state.logs.slice().reverse();
  html += `<div class="card"><h2>Verlauf</h2>${logs.length ? logs.map(l=>{
    const d = new Date(l.date);
    const vol = l.items.reduce((s,i)=>s+i.sets.filter(x=>x.done).reduce((t,x)=>t+(num(x.kg)||0)*(num(x.reps)||0),0),0);
    return `<details style="border-top:1px solid var(--line);padding:10px 0"><summary style="cursor:pointer"><b>${d.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'2-digit'})}</b> · ${esc(l.label)}<br><span class="small muted">${l.items.length} Übungen · ${Math.round(vol).toLocaleString('de-DE')} kg bewegt${(l.prs||[]).length?` · <b style="color:var(--warn)">🏆 ${l.prs.length===1?'1 Rekord':l.prs.length+' Rekorde'}</b>`:''}</span></summary>
      <ul class="plain">${l.items.map(i=>`<li>${esc(i.name)}: ${i.sets.filter(s=>s.done).map(s=>`${s.pr?'🏆 ':''}${esc(s.kg||'–')} kg × ${esc(s.reps||'?')}`).join(', ')||'<span class="muted">nicht erledigt</span>'}</li>`).join('')}</ul>
      ${l.note?`<p class="small" style="margin:6px 0 0">📝 ${esc(l.note)}</p>`:''}
      <button class="ghost danger small" data-action="dellog" data-id="${l.id}" style="min-height:36px;margin-top:6px">Eintrag löschen</button></details>`;
  }).join('') : '<p class="muted small">Noch keine abgeschlossenen Einheiten.</p>'}</div>`;
  return html;
}
function finishSession(){
  const a = state.active;
  if(!a.items.some(i=>i.sets.some(s=>s.done))){ toast('Noch kein Satz abgehakt'); return false; }
  // Rekorde neu berechnen (falls kg/Wdh. nach dem Abhaken geändert wurden); pro Übung der letzte = beste
  const byEx = {};
  for(const p of sessionPRs(a)) byEx[p.ex] = {ex:p.ex, name:p.name, txt:p.txt};
  a.prs = Object.values(byEx);
  state.logs.push(a); state.active = null; state.timer = null;
  if(a.prs.length){ toast(`🏆 ${a.prs.length===1?'1 Rekord':a.prs.length+' Rekorde'} heute! ` + a.prs.map(p=>`${p.name}: ${p.txt}`).join(' · '), 4500); celebrate(); }
  else toast('Einheit gespeichert 💪');
  return true;
}

// ---- Pausen-Timer ----
let audioCtx = null;
function unlockAudio(){ try{ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); }catch(e){} }
function beep(){
  if(!state.sound || !audioCtx) return;
  try{
    const t0 = audioCtx.currentTime;
    [0, .25, .5].forEach((dt,i)=>{ const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.frequency.value = i===2?1320:880; o.type='sine';
      g.gain.setValueAtTime(.0001,t0+dt); g.gain.exponentialRampToValueAtTime(.4,t0+dt+.02); g.gain.exponentialRampToValueAtTime(.0001,t0+dt+.2);
      o.connect(g).connect(audioCtx.destination); o.start(t0+dt); o.stop(t0+dt+.22); });
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){}
}
// Rekord feiern: Konfetti (ohne bei „Bewegung reduzieren“), heller Dreiklang, Vibration
function celebrate(){
  try{
    if(!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)){
      const c = document.createElement('div'); c.className = 'confetti'; c.setAttribute('aria-hidden','true');
      const cols = ['var(--accent)','var(--warn)','var(--ok)','#e2557a','#4f7cff','#f2c94c'];
      c.innerHTML = Array.from({length:36},(_,i)=>`<i style="left:${Math.random()*100}%;background:${cols[i%cols.length]};animation-delay:${Math.random()*.35}s;animation-duration:${1.2+Math.random()*.8}s;transform:rotate(${Math.random()*180}deg)"></i>`).join('');
      document.body.appendChild(c); setTimeout(()=>c.remove(), 2600);
    }
  }catch(e){}
  if(state.sound && audioCtx){
    try{
      const t0 = audioCtx.currentTime;
      [660, 880, 1320].forEach((f,i)=>{ const o=audioCtx.createOscillator(), g=audioCtx.createGain(), dt=i*.12; o.frequency.value=f; o.type='triangle';
        g.gain.setValueAtTime(.0001,t0+dt); g.gain.exponentialRampToValueAtTime(.35,t0+dt+.02); g.gain.exponentialRampToValueAtTime(.0001,t0+dt+(i===2?.45:.15));
        o.connect(g).connect(audioCtx.destination); o.start(t0+dt); o.stop(t0+dt+.5); });
    }catch(e){}
  }
  try{ navigator.vibrate && navigator.vibrate([60,40,60,40,120]); }catch(e){}
}
function startTimer(sec, label){ state.timer = {endAt: Date.now()+sec*1000, total:sec, label}; save(); renderTimer(); }
function renderTimer(){
  const bar = $('#timerbar'); const t = state.timer;
  if(!t){ bar.hidden = true; document.body.classList.remove('has-timer'); return; }
  const left = Math.max(0, Math.round((t.endAt - Date.now())/1000));
  bar.hidden = false; document.body.classList.add('has-timer');
  bar.innerHTML = `<div class="tprog" style="width:${Math.min(100,(1-left/t.total)*100)}%"></div>
    <div class="row" style="position:relative"><div style="flex:1;min-width:0"><div class="small muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Pause · ${esc(t.label||'')}</div>
    <div class="tleft">${Math.floor(left/60)}:${pad2(left%60)}</div></div>
    <button class="icon" data-action="tminus">−15</button><button class="icon" data-action="tplus">+15</button><button class="icon primary" data-action="tskip">✓</button></div>`;
}
setInterval(()=>{
  const t = state.timer; if(!t) return;
  if(Date.now() >= t.endAt){ state.timer = null; save(); renderTimer(); beep(); toast('⏱ Pause vorbei – nächster Satz!', 2500); }
  else renderTimer();
}, 250);

function ringSvg(val, goal, label, unit){
  const pct = goal>0 ? val/goal : 0, r = 42, C = 2*Math.PI*r, over = pct>1.05;
  return `<div class="ring"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="${r}" class="rtrack"/><circle cx="50" cy="50" r="${r}" class="rfill${over?' over':''}" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-Math.min(1,pct))}" transform="rotate(-90 50 50)"/></svg>
    <div class="rtxt"><b>${Math.round(val)}</b><span>von ${Math.round(goal)}${unit}</span></div><div class="rlbl">${label}</div></div>`;
}
function macroBar(lbl, v, g){ return `<div class="bar macro"><span>${lbl}</span><div class="track"><div class="fill${v>g*1.1?' over':''}" style="width:${Math.min(100,g?v/g*100:0)}%"></div></div><span class="v">${Math.round(v)}/${Math.round(g)} g</span></div>`; }

    ${items.map(e=>`<button class="fitem" data-action="foodEdit" data-id="${e.id}"><span class="fn">${esc(e.name)}${e.g?` <span class="muted">· ${fmt(e.g)} g</span>`:''}</span><span class="fk">${Math.round(e.kcal)} kcal<br><span class="muted">${fmt(e.p)} g P</span></span></button>`).join('')}
    ${(()=>{ const y = foodDay(addDays(ui.foodDate,-1)).filter(e=>e.meal===k); const b=[];

// ---- Barcode-Scanner: eigene Kamera-Steuerung + ZXing-C++ (WebAssembly) ----
let scanLibPromise = null;
function loadScanLib(){
  if(window.BarcodeDetectionAPI) return Promise.resolve();
  if(!scanLibPromise) scanLibPromise = new Promise((res, rej)=>{
    const el = document.createElement('script'); el.src = 'barcode-detector.js';
    el.onload = ()=> window.BarcodeDetectionAPI ? res() : (scanLibPromise=null, rej(new Error('lib')));
    el.onerror = ()=>{ scanLibPromise = null; el.remove(); rej(new Error('load')); };
    document.head.appendChild(el);
  });
  return scanLibPromise;
}
const SCAN_FORMATS = ['ean_13','ean_8','upc_a','upc_e'];
async function getDetector(){
  if(ui.detector) return ui.detector;
  // Native Schnittstelle (z. B. Chrome auf Android) nutzen, wenn sie EAN kann
  try{
    if('BarcodeDetector' in window && window.BarcodeDetector.getSupportedFormats){
      const f = await window.BarcodeDetector.getSupportedFormats();
      const fm = SCAN_FORMATS.filter(x=>f.includes(x));
      if(fm.includes('ean_13')) return ui.detector = new window.BarcodeDetector({formats:fm});
    }
  }catch(e){}
  await loadScanLib();
  const api = window.BarcodeDetectionAPI;
  // WebAssembly-Datei vom eigenen Server laden (offline-fähig, kein CDN)
  api.setZXingModuleOverrides({ locateFile:(p, prefix)=> p.endsWith('.wasm') ? new URL('zxing_reader.wasm', location.href).href : prefix + p });
  await api.prepareZXingModule({fireImmediately:true});
  return ui.detector = new api.BarcodeDetector({formats:SCAN_FORMATS});
}
function eanValid(code, format){
  if(format==='upc_e') return /^\d{6,8}$/.test(code);
  if(!/^(\d{8}|\d{12}|\d{13})$/.test(code)) return false;
  const d = code.split('').map(Number), chk = d.pop();
  // EAN-8: Gewichte 3,1,3,…  –  EAN-13/UPC-A: von rechts 3,1,3,…
  const sum = d.reverse().reduce((s,x,i)=>s + x*(i%2===0?3:1), 0);
  return (10 - sum%10)%10 === chk;
}
function scanMsg(html){ const i = document.getElementById('scanInfo'); if(i) i.innerHTML = html; }
function scanErrText(e){
  const m = String((e && (e.name+' '+e.message)) || e || '');
  if(/NotAllowed|Permission|denied/i.test(m)) return 'Kein Zugriff auf die Kamera. Erlaube ihn unter <b>Einstellungen → Safari → Kamera</b> (bzw. beim nächsten Nachfragen „Erlauben“) und öffne den Scanner erneut.';
  if(/NotFound|DevicesNotFound|no camera/i.test(m)) return 'Keine Kamera gefunden.';
  if(/NotReadable|TrackStart|in use/i.test(m)) return 'Die Kamera wird gerade von einer anderen App benutzt. Schließe sie und versuche es erneut.';
  if(/secure|https|insecure/i.test(m)) return 'Die Kamera funktioniert nur, wenn die App über https:// geöffnet wird (z. B. GitHub Pages).';
  return 'Kamera konnte nicht gestartet werden ('+esc(m.slice(0,80))+').';
}
async function startScanner(){
  const reader = document.getElementById('reader');
  if(!reader || ui.scan) return;
  const scan = ui.scan = {stopped:false, last:null, lastAt:0, n:0, t0:Date.now()};
  try{
    if(!window.isSecureContext) throw new Error('insecure');
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ scanMsg('Dieser Browser erlaubt keinen Kamerazugriff. Tippe die Barcode-Nummer unten ein.'); ui.scan = null; return; }
    const detP = getDetector(); detP.catch(()=>{});            // Decoder parallel zur Kamera laden
    const stream = await navigator.mediaDevices.getUserMedia({audio:false,
      video:{facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080}}});
    if(scan.stopped || !document.getElementById('reader')){ stream.getTracks().forEach(t=>t.stop()); return; }
    scan.stream = stream; scan.track = stream.getVideoTracks()[0];
    const v = document.createElement('video');
    v.setAttribute('playsinline',''); v.setAttribute('muted',''); v.muted = true; v.autoplay = true; v.srcObject = stream;
    reader.querySelector('.rvid').replaceChildren(v);
    scan.video = v;
    try{ await v.play(); }catch(e){}
    // Fokus, Zoom und Taschenlampe – nur wenn die Kamera das anbietet
    try{
      const cap = scan.track.getCapabilities ? scan.track.getCapabilities() : {};
      const adv = {};
      if(Array.isArray(cap.focusMode) && cap.focusMode.includes('continuous')) adv.focusMode = 'continuous';
      if(cap.zoom && cap.zoom.max >= 1.5){ scan.zoomCap = cap.zoom; scan.zoom = Math.min(2, cap.zoom.max); adv.zoom = scan.zoom; const zb=$('#zoomBtn'); if(zb){ zb.hidden=false; zb.textContent=fmt(scan.zoom)+'×'; } }
      if(Object.keys(adv).length) await scan.track.applyConstraints({advanced:[adv]});
      if(cap.torch){ const tb=$('#torchBtn'); if(tb) tb.hidden=false; }
    }catch(e){}
    scanMsg('Halte das iPhone ca. 15–25 cm entfernt, den Barcode waagerecht im Rahmen.');
    let detector;
    try{ detector = await detP; }
    catch(e){ scanMsg('Der Scanner konnte nicht geladen werden. Öffne die App einmal mit Internetverbindung und versuche es erneut – oder tippe die Barcode-Nummer unten ein.'); stopScanner(); return; }
    if(scan.stopped) return;
    const c = document.createElement('canvas'), ctx = c.getContext('2d', {willReadFrequently:true});
    const tick = async ()=>{
      if(scan.stopped) return;
      if(v.readyState >= 2 && v.videoWidth){
        scan.n++;
        const W = v.videoWidth, H = v.videoHeight, full = scan.n % 3 === 0;
        // Meist nur den mittleren Streifen auswerten (schneller, weniger Störungen), jedes 3. Mal das ganze Bild
        let sw = full ? W : Math.round(W*0.85), sh = full ? H : Math.round(H*0.45);
        const sx = Math.round((W-sw)/2), sy = Math.round((H-sh)/2);
        const k = Math.min(1, 1280/Math.max(sw, sh));
        c.width = Math.round(sw*k); c.height = Math.round(sh*k);
        ctx.drawImage(v, sx, sy, sw, sh, 0, 0, c.width, c.height);
        try{
          const res = await detector.detect(c);
          const hit = res.find(r=>eanValid(r.rawValue, r.format));
          if(hit && !scan.stopped){
            const now = Date.now();
            // Erst übernehmen, wenn derselbe Code 2× kurz hintereinander erkannt wurde
            if(hit.rawValue===scan.last && now-scan.lastAt < 2000){ return scanFound(hit.rawValue); }
            scan.last = hit.rawValue; scan.lastAt = now;
          }
        }catch(e){}
      }
      if(!scan.hinted && Date.now()-scan.t0 > 8000){ scan.hinted = true;
        scanMsg('Noch nichts erkannt? Halte das iPhone <b>etwas weiter weg</b> (bis 30 cm), vermeide Spiegelungen'+($('#torchBtn')&&!$('#torchBtn').hidden?', nutze die Lampe':'')+' – oder tippe die Nummer unten ein.'); }
      scan.timer = setTimeout(tick, 100);
    };
    tick();
  }catch(e){
    scanMsg(scanErrText(e)); stopScanner();
  }
}
function scanFound(code){
  try{ navigator.vibrate && navigator.vibrate(80); }catch(e){}
  if(state.sound && audioCtx){ try{ const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.frequency.value=1200; g.gain.value=.15; o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+.08); }catch(e){} }
  stopScanner().then(()=>lookupBarcode(code));
}
async function stopScanner(){
  const s = ui.scan; ui.scan = null;
  if(!s) return;
  s.stopped = true; clearTimeout(s.timer);
  try{ if(s.stream) s.stream.getTracks().forEach(t=>t.stop()); }catch(e){}
  try{ if(s.video){ s.video.pause(); s.video.srcObject = null; } }catch(e){}
}

function lineChart(series, opt){
  // series: [{pts:[{x,y}], cls}] – x in Tagen, y Werte
  const all = series.flatMap(s=>s.pts); if(all.length<1) return '';
  const W=320, H=150, pl=34, pr=8, pt=10, pb=22;
  let x0 = Math.min(...all.map(p=>p.x)), x1 = Math.max(...all.map(p=>p.x)); if(x1===x0){ x0-=1; x1+=1; }
  let y0 = Math.min(...all.map(p=>p.y)), y1 = Math.max(...all.map(p=>p.y)); const padY = Math.max(.5,(y1-y0)*.15); y0-=padY; y1+=padY;
  const X = x => pl + (x-x0)/(x1-x0)*(W-pl-pr), Y = y => pt + (1-(y-y0)/(y1-y0))*(H-pt-pb);
  const grid = [0,.5,1].map(f=>{const v=y0+(y1-y0)*f; return `<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" class="cgrid"/><text x="${pl-4}" y="${Y(v)+4}" class="clab" text-anchor="end">${fmt(v)}</text>`;}).join('');
  const lines = series.map(s=>{
    const path = s.pts.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
    return (s.pts.length>1?`<path d="${path}" class="${s.cls}"/>`:'') + (s.dots ? s.pts.map(p=>`<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="2.6" class="${s.cls}-dot"/>`).join('') : '');
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(opt.label||'Diagramm')}">${grid}${lines}
    <text x="${pl}" y="${H-6}" class="clab">${esc(opt.from)}</text><text x="${W-pr}" y="${H-6}" class="clab" text-anchor="end">${esc(opt.to)}</text></svg>`;
}
// Rekordliste pro Übung (immer aus den Sätzen berechnet – funktioniert auch mit alten Einträgen)
function recordsCard(){
  const names = {};
  for(const l of state.logs) for(const i of l.items) if(doneSets(i).length) names[i.ex] = (EX[i.ex] && EX[i.ex].n) || i.name;
  const sd = d => d ? parseDay(d).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit'}) : '';
  const rows = Object.keys(names).map(id=>{ const b = exBests(state.logs, id);
      return {id, b, last:[b.topD, b.e1D, b.bwD].filter(Boolean).sort().pop()}; })
    .filter(x=>x.b.top || x.b.bw).sort((a,b)=>a.last<b.last ? 1 : a.last>b.last ? -1 : 0);
  if(!rows.length) return '';
  const recent = addDays(todayStr(), -7);
  const fresh = new Set(state.logs.filter(l=>String(l.date).slice(0,10)>=recent).flatMap(l=>(l.prs||[]).map(p=>p.ex)));

function shareFile(content, name, type){
  const blob = new Blob([content],{type});
  const f = new File([blob], name, {type});
  if(navigator.canShare && navigator.canShare({files:[f]})){ navigator.share({files:[f], title:name}).catch(()=>{}); return; }
  const u = URL.createObjectURL(blob); const a = document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u), 4000);
}

function itemKg(it){ const k = it.sets.map(s=>num(s.kg)).filter(x=>x>0); return k.length ? Math.max(...k) : 0; }
function platesHtml(it){
  const ex = EX[it.ex], bar = barFor(ex, state.barKg); if(bar==null) return '';
  const kg = itemKg(it); if(!(kg>0)) return '';
  const p = platesFor(kg, bar);
  if(p.below) return `🏋 Leichter als die Stange (${fmt(bar)} kg)`;
  const side = p.side.length ? p.side.map(fmt2).join(' + ')+' kg' : 'keine Scheiben';

}
function warmHtml(it, first){
  if(!it.main) return '';
  const ex = EX[it.ex], w = warmupSets(itemKg(it), ex, first, barFor(ex, state.barKg));

const MEASURES = [['taille','Taille'],['brust','Brust'],['huefte','Hüfte'],['arm','Oberarm'],['bein','Oberschenkel']];
function measuresCard(){
  const ms = (state.measures||[]).slice().sort((a,b)=>a.date<b.date?-1:1), last = ms[ms.length-1] || {}, first = ms[0] || {};

function mealByTime(){ if(ui.foodDate!==todayStr()) return 'snack'; const h = new Date().getHours(); return h<10 ? 'fruehstueck' : h<15 ? 'mittag' : h<21 ? 'abend' : 'snack'; }
function proteinCard(tgt, sum){
  const miss = Math.round(tgt.p - sum.p);
  if(miss < 10){ ui.protList = []; return ''; }
  const kLeft = Math.round(tgt.kcal - sum.kcal);
  const list = ui.protList = proteinSuggestions(miss, kLeft, [...state.food.favs, ...state.food.recent]);
  if(!list.length) return '';
  return `<div class="card"><h2 style="font-size:16px">💡 Protein-Hilfe</h2>
    <p class="small muted" style="margin:-4px 0 6px">Noch <b>${miss} g Protein</b> offen · ${kLeft>0 ? kLeft+' kcal übrig' : 'Kalorienziel schon erreicht'}</p>
    ${list.map((f,i)=>`<div class="fitem2"><div class="fpick"><span class="fn">${esc(f.name)}${f.own?' <span class="pill heavy">deins</span>':''}</span>
      <span class="small muted">${f.g?fmt(f.g)+' g · ':''}<b style="color:var(--accent)">+${fmt(f.p)} g Protein</b> · ${Math.round(f.kcal)} kcal</span></div>
